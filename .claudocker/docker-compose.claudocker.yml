services:
  claudocker:
    image: claudocker-base:latest
    stdin_open: true
    tty: true
    privileged: true
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      - /Users/pavel/obsidian-test:/Users/pavel/obsidian-test
      - ${HOME}/.claude:/home/dev/.claude
      - ${HOME}/.claude.json:/home/dev/.claude.json
      - ${HOME}/.claudocker/local:/home/dev/.claudocker-persist
    environment:
      - HOST_UID=501
      - HOST_GID=20
      - HOME=/home/dev
      - CLAUDE_CONFIG_DIR=/home/dev/.claude
      - CLAUDE_DANGEROUS_SKIP_PERMISSIONS=true
